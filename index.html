<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="filtros"
    <input type="search" id="buscador" placeholder="buscar por nombre, provincia o categoria"> </input>

    <select id="filtroCategoria"></select>

    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>    

    <section class="addFood">
      <form id ="agregarComidaForm">
        <h2>Agregar Comida</h2>
        <label for="nombre">Nombre de la comida</label>
        <input id="nombre" placeholder="Nombre de la comida" required>

        <label for="provincia">provincia</label>
        <input type="text" id="provincia" placeholder="provincia" required>

        <label for="categoria">categoria</label>
        <input type="text" id="categoria" placeholder="categoria" required>

        <label for="ingredientes">ingredientes</label>
        <input type="text" id="ingredientes" placeholder="ingredientes" required>
        
        <button type="submit">Agregar</button>

      </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
